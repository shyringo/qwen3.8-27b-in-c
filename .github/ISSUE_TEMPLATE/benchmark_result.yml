name: Benchmark result
description: Share a reproducible Qwen3.8 hardware result
title: "[benchmark] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing the engine. Complete measurements make results comparable across CPUs, memory sizes, operating systems and GGUF files.
  - type: input
    id: commit
    attributes:
      label: Engine commit
      description: Output of `git rev-parse HEAD`.
      placeholder: 40-character commit SHA
    validations: {required: true}
  - type: input
    id: model
    attributes:
      label: GGUF file and SHA-256
      placeholder: Qwen3.8-27B-UD-IQ1_M.gguf, sha256 ...
    validations: {required: true}
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and operating system
      description: CPU, installed/visible RAM, storage device and filesystem, OS/WSL version, compiler.
      placeholder: Intel Core i5-1340P; 32 GB; NVMe/ext4; WSL2 Ubuntu 22.04; GCC 11.4
    validations: {required: true}
  - type: textarea
    id: command
    attributes:
      label: Exact command and environment
      render: shell
    validations: {required: true}
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Prompt tokens, output tokens, context, thread count, thinking mode, sampling/greedy mode, and whether model pages were warm.
    validations: {required: true}
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Report TTFT, TPOT, token/s, peak RSS and total wall time as printed by the engine and `/usr/bin/time -v` when available.
    validations: {required: true}
  - type: textarea
    id: verification
    attributes:
      label: Correctness checks
      description: Include `make test` status and whether output/token IDs were checked.
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Raw benchmark output
      render: text
  - type: checkboxes
    id: publish
    attributes:
      label: Community table
      options:
        - label: This result may be quoted in a repository community benchmark table with attribution to this issue.

